<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Payment Successful - ArrowTechz</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      background: #0d0d0d;
      color: #00ffcc;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 100px;
    }
    .success-box {
      border: 2px solid #00ffcc;
      border-radius: 12px;
      padding: 40px;
      display: inline-block;
      background: rgba(0, 255, 204, 0.1);
      box-shadow: 0 0 20px #00ffcc;
    }
    h1 {
      font-size: 2.5rem;
      margin-bottom: 20px;
    }
    p {
      font-size: 1.2rem;
    }
    a {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 24px;
      background: #00ffcc;
      color: #0d0d0d;
      text-decoration: none;
      font-weight: bold;
      border-radius: 8px;
      transition: 0.3s;
    }
    a:hover {
      background: #00ccaa;
    }
  </style>
</head>
<body>
  <div class="success-box">
    <h1>✅ Payment Successful!</h1>
    <p>Thank you for your purchase. Your account is now activated.</p>
    <a href="login.html">Go to Login</a>
  </div>
</body>
</html>
